l="#5d6a67" text-anchor="start">(+ the Hitachi .txt)</text><rect x="68" y="316" width="250" height="78" rx="10" fill="#eef6f3" stroke="none" stroke-width="1.5"/><text x="84" y="342" font-family="'IBM Plex Sans', sans-serif" font-size="15.5" font-weight="600" fill="#15201e" text-anchor="start">Result</text><text x="84" y="364" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">clickable SVG outline for</text><text x="84" y="384" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">every shell, stats, tables</text><rect x="68" y="406" width="250" height="78" rx="10" fill="#eef6f3" stroke="none" stroke-width="1.5"/><text x="84" y="432" font-family="'IBM Plex Sans', sans-serif" font-size="15.5" font-weight="600" fill="#15201e" text-anchor="start">History</text><text x="84" y="454" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">every past analysis,</text><text x="84" y="474" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">shareable links</text><rect x="68" y="496" width="250" height="58" rx="10" fill="#eef6f3" stroke="none" stroke-width="1.5"/><text x="84" y="522" font-family="'IBM Plex Sans', sans-serif" font-size="15.5" font-weight="600" fill="#15201e" text-anchor="start">Downloads</text><text x="84" y="544" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">.xlsx and .csv files</text><rect x="68" y="636" width="53.0" height="22" rx="11" fill="#e3eee9"/><text x="94.5" y="651.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">react</text><rect x="128.0" y="636" width="88.0" height="22" rx="11" fill="#e3eee9"/><text x="172.0" y="651.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">typescript</text><rect x="223.0" y="636" width="46.0" height="22" rx="11" fill="#e3eee9"/><text x="246.0" y="651.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">vite</text><rect x="390" y="140" width="240" height="280" rx="14" fill="#ffffff" stroke="#d6d6cc" stroke-width="1.5"/><text x="410" y="178" font-family="'IBM Plex Sans', sans-serif" font-size="21" font-weight="700" fill="#15201e" text-anchor="start">diamometer.us</text><text x="410" y="202" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#5d6a67" text-anchor="start">Cloudflare Worker (free)</text><text x="410" y="236" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">• streams every request</text><text x="410" y="258" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">   to the Modal server</text><text x="410" y="280" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">• forces https:// and</text><text x="410" y="302" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">   drops www.</text><text x="410" y="324" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">• domain from Porkbun,</text><text x="410" y="346" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#15201e" text-anchor="start">   DNS on Cloudflare</text><rect x="410" y="384" width="144.0" height="22" rx="11" fill="#e3eee9"/><text x="482.0" y="399.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">cloudflare-workers</text><rect x="390" y="444" width="240" height="256" rx="14" fill="none" stroke="#d6d6cc" stroke-width="1.5" stroke-dasharray="6 6"/><text x="410" y="474" font-family="'IBM Plex Sans', sans-serif" font-size="15.5" font-weight="600" fill="#15201e" text-anchor="start">Why this setup?</text><text x="410" y="500" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">Free hosts give ~512 MB RAM;</text><text x="410" y="521" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">one dense photo needs ~2 GB.</text><text x="410" y="542" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">Modal&#x27;s free tier gives 4 GB</text><text x="410" y="563" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">and sleeps when idle ($0).</text><text x="410" y="584" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">Its free plan has no custom</text><text x="410" y="605" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">domains, so a Cloudflare</text><text x="410" y="626" font-family="'IBM Plex Sans', sans-serif" font-size="13.5" font-weight="400" fill="#5d6a67" text-anchor="start">Worker serves diamometer.us.</text><rect x="680" y="124" width="872" height="846" rx="14" fill="#fbfbf8" stroke="#0d7a6b" stroke-width="2"/><text x="704" y="162" font-family="'IBM Plex Sans', sans-serif" font-size="21" font-weight="700" fill="#15201e" text-anchor="start">Modal · serverless Python server</text><text x="704" y="186" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="400" fill="#5d6a67" text-anchor="start">2 CPU · 4 GB RAM · one container · sleeps when idle, wakes on the next visit</text><rect x="1400" y="146" width="53.0" height="22" rx="11" fill="#e3eee9"/><text x="1426.5" y="161.5" font-family="'IBM Plex Mono', monospace" font-size=" xt><text x="740" y="670" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">length, width, area, angle,</text><text x="740" y="689" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">solidity, all converted</text><text x="740" y="708" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">to real micrometers</text><rect x="738" y="758" width="102.0" height="22" rx="11" fill="#e3eee9"/><text x="789.0" y="773.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">scikit-image</text><rect x="847.0" y="758" width="60.0" height="22" rx="11" fill="#e3eee9"/><text x="877.0" y="773.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" text-anchor="middle">opencv</text><path d="M964,706.0 L994,706.0" fill="none" stroke="#15201e" stroke-width="2.2" marker-end="url(#head)"/><rect x="998" y="618" width="236" height="176" rx="10" fill="#eef6f3" stroke="none" stroke-width="1.5"/><text x="1014" y="646" font-family="'IBM Plex Sans', sans-serif" font-size="15.5" font-weight="700" fill="#15201e" text-anchor="start">5  Name &amp; grade</text><text x="1014" y="670" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">species from published sizes;</text><text x="1014" y="689" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">intact / cracked /</text><text x="1014" y="708" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="400" fill="#5d6a67" text-anchor="start">fragmented / partial; facing</text><rect x="1012" y="758" width="53.0" height="22" rx="11" fill="#e3eee9"/><text x="1038.5" y="773.5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#0d7a6b" tex
